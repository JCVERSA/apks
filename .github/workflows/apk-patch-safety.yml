name: APK patch safety evidence

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7234f8d6-apks
    paths:
      - .github/workflows/apk-patch-safety.yml
      - .github/scripts/patch_safety.py

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-patch-safety-${{ github.ref }}
  cancel-in-progress: false

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snaptube-static-trees
          run-id: '41155692929'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/static-trees
      - name: Extract pre-patch safety evidence
        shell: bash
        env:
          TREES_ROOT: ${{ runner.temp }}/static-trees
          OUTPUT_ROOT: ${{ runner.temp }}/patch-safety
        run: python3 .github/scripts/patch_safety.py "$TREES_ROOT" "$OUTPUT_ROOT"
      - name: Publish safety evidence
        if: always()
        shell: bash
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/patch-safety
        run: |
          set -euo pipefail
          dest="analysis/remote/safety-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          if [ -d "$OUTPUT_ROOT" ]; then cp -a "$OUTPUT_ROOT/." "$dest/"; fi
          du -sh "$dest" || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          if git diff --cached --quiet; then
            echo "No new safety evidence."
          else
            git commit -m "Publish pre-patch safety evidence from run ${GITHUB_RUN_ID} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
