name: ZArchiver full and design audit

on:
  workflow_dispatch:
  push:
    branches: [arena/7234f8d6-apks]
    paths:
      - '.github/workflows/zarchiver-full-audit.yml'
      - '.github/scripts/zarchiver_full_audit.py'
      - '.github/scripts/zarchiver_design_audit.py'

permissions:
  contents: write

concurrency:
  group: zarchiver-full-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    name: Static security and design audit without executing the APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      APK_PATH: base.apk
      EXPECTED_SHA256: aab078d2ea7b80e7199d2bb988772128131848c4df078ea8c55b19df7dfc16fd
    steps:
      - name: Check out analysis inputs
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Set up JDK on the GitHub runner only
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify input and decode with pinned tools
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/zarchiver-audit
          TOOLS_ROOT: ${{ runner.temp }}/zarchiver-tools
        run: bash .github/scripts/zarchiver_prepare.sh

      - name: Run extended security and quality audit
        if: always()
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/zarchiver-audit
          REPORT_DIR: ${{ runner.temp }}/zarchiver-audit/audit-reports
        run: |
          if [ -d "$WORK_ROOT/decoded" ]; then
            python3 .github/scripts/zarchiver_full_audit.py
          else
            echo 'Decoded tree missing; skipping security audit.' >&2
          fi

      - name: Run design and theme-mode audit
        if: always()
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/zarchiver-audit
          REPORT_DIR: ${{ runner.temp }}/zarchiver-audit/design-reports
        run: |
          if [ -d "$WORK_ROOT/decoded/res" ]; then
            python3 .github/scripts/zarchiver_design_audit.py
          else
            echo 'Decoded resources missing; skipping design audit.' >&2
          fi

      - name: Publish bounded job summary
        if: always()
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/zarchiver-audit
        run: |
          for f in "$WORK_ROOT/audit-reports/audit-summary.json" "$WORK_ROOT/design-reports/design-digest.md"; do
            if [ -f "$f" ]; then
              printf '\n## %s\n\n```\n' "$(basename "$f")" >> "$GITHUB_STEP_SUMMARY"
              head -c 200000 "$f" >> "$GITHUB_STEP_SUMMARY"
              printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      - name: Publish audit evidence to the analysis branch
        if: always()
        shell: bash
        env:
          WORK_ROOT: ${{ runner.temp }}/zarchiver-audit
        run: |
          set -euo pipefail
          dest="analysis/remote/zarchiver-audit-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          if [ -d "$WORK_ROOT/audit-reports" ]; then cp -a "$WORK_ROOT/audit-reports" "$dest/security"; fi
          if [ -d "$WORK_ROOT/design-reports" ]; then cp -a "$WORK_ROOT/design-reports" "$dest/design"; fi
          if [ -d "$WORK_ROOT/logs" ]; then cp -a "$WORK_ROOT/logs" "$dest/logs"; fi
          printf 'run_outcome=%s\nrun_id=%s\n' '${{ job.status }}' "$GITHUB_RUN_ID" > "$dest/run-status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Add ZArchiver full and design audit evidence (run ${GITHUB_RUN_ID}) [skip ci]"
            git fetch origin arena/7234f8d6-apks
            git rebase FETCH_HEAD
            git push origin HEAD:arena/7234f8d6-apks
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zarchiver-full-design-audit
          path: |
            ${{ runner.temp }}/zarchiver-audit/audit-reports/
            ${{ runner.temp }}/zarchiver-audit/design-reports/
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6
