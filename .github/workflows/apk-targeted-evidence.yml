name: APK targeted evidence extract

on:
  workflow_dispatch:
  push:
    branches:
      - arena/7234f8d6-apks
    paths:
      - .github/workflows/apk-targeted-evidence.yml
      - .github/scripts/targeted_evidence.py

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-targeted-evidence-${{ github.ref }}
  cancel-in-progress: false

jobs:
  extract:
    name: Extract method-level evidence from completed static trees
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true

      - name: Download completed decoded/decompiled trees on GitHub runner
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: snaptube-static-trees
          run-id: '41155692929'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/static-trees

      - name: Extract bounded targeted evidence
        shell: bash
        env:
          TREES_ROOT: ${{ runner.temp }}/static-trees
          OUTPUT_ROOT: ${{ runner.temp }}/targeted-evidence
        run: |
          python3 .github/scripts/targeted_evidence.py "$TREES_ROOT" "$OUTPUT_ROOT"

      - name: Publish targeted evidence to analysis branch
        shell: bash
        env:
          OUTPUT_ROOT: ${{ runner.temp }}/targeted-evidence
        run: |
          set -euo pipefail
          dest="analysis/remote/targeted-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          cp -a "$OUTPUT_ROOT/." "$dest/"
          du -sh "$dest"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$dest"
          if git diff --cached --quiet; then
            echo "Targeted evidence already published."
          else
            git commit -m "Publish targeted static evidence from run ${GITHUB_RUN_ID} [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
