name: APK extractor plugin path evidence

on:
  workflow_dispatch:
  push:
    branches: [arena/7234f8d6-apks]
    paths:
      - '.github/workflows/apk-extractor-plugin-evidence.yml'
      - '.github/scripts/extractor_plugin_evidence.py'

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-extractor-plugin-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trace-plugin:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: snaptube-static-trees
          run-id: '41155692929'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/static-trees
      - name: Copy plugin load path evidence
        run: |
          python3 .github/scripts/extractor_plugin_evidence.py \
            '${{ runner.temp }}/static-trees' \
            '${{ runner.temp }}/plugin-evidence'
      - name: Publish plugin-path evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="analysis/remote/extractor-plugin-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          src="${RUNNER_TEMP}/plugin-evidence"
          if [ -d "$src" ]; then cp -a "$src/." "$dest/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Trace site_extractor plugin load path and AvailabilityChecker (run ${GITHUB_RUN_ID}) [skip ci]"
            git push origin HEAD:arena/7234f8d6-apks
          fi
