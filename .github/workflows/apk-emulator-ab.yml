name: APK emulator A/B download test

on:
  workflow_dispatch:
  push:
    branches: [arena/7234f8d6-apks]
    paths:
      - '.github/workflows/apk-emulator-ab.yml'
      - '.github/scripts/emulator_ab_test.py'

permissions:
  contents: write

concurrency:
  group: apk-emulator-ab-${{ github.ref }}
  cancel-in-progress: false

jobs:
  emulator-ab:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Download published revision 3 APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/ab-apks"
          gh release download snaptube-patched-41267483266 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "${RUNNER_TEMP}/ab-apks" --clobber
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run original vs revision 3 in API 35 emulator (ARM translation)
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_5
          cores: 2
          ram-size: 4096M
          heap-size: 512M
          disk-size: 8192M
          force-avd-creation: true
          emulator-boot-timeout: 900
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: python3 .github/scripts/emulator_ab_test.py --original google_drive/SnapTube.apk --patched "${RUNNER_TEMP}/ab-apks/SnapTube-7.52.0.75250210-adfree-noforce-official-removed.apk" --out "${RUNNER_TEMP}/emulator-ab"
      - name: Publish sanitized emulator evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="analysis/remote/emulator-ab-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          src="${RUNNER_TEMP}/emulator-ab"
          if [ -d "$src" ]; then cp -a "$src/." "$dest/"; fi
          printf 'run_outcome=%s\nrun_id=%s\n' '${{ job.status }}' "$GITHUB_RUN_ID" > "$dest/run-status.txt"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Add isolated emulator A/B download evidence (run ${GITHUB_RUN_ID}) [skip ci]"
            git push origin HEAD:arena/7234f8d6-apks
          fi
