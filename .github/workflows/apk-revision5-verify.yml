name: Verify published revision 4 APK

on:
  workflow_dispatch:
  push:
    branches: [arena/7234f8d6-apks]
    paths:
      - '.github/workflows/apk-revision4-verify.yml'
      - '.github/scripts/verify_release.py'

permissions:
  contents: write

concurrency:
  group: apk-rev4-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
      - name: Download published release asset and pinned Apktool
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/rev4-verify"
          TOOLS="${RUNNER_TEMP}/rev4-tools"
          mkdir -p "$WORK" "$TOOLS"
          gh release download snaptube-patched-41272222816 --repo "$GITHUB_REPOSITORY" \
            --pattern '*.apk' --dir "$WORK" --clobber
          V=3.0.3
          SHA=dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423
          curl --fail --location --retry 3 -o "$TOOLS/apktool.jar" "https://github.com/iBotPeaches/Apktool/releases/download/v${V}/apktool_${V}.jar"
          printf '%s  %s\n' "$SHA" "$TOOLS/apktool.jar" | sha256sum -c -
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          BT="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APK="$(find "$WORK" -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          "$BT/apksigner" verify --verbose --print-certs "$APK" > "$WORK/signature-verify.log" 2>&1
          "$BT/zipalign" -c 4 "$APK" > "$WORK/zipalign-4.log" 2>&1
          "$BT/zipalign" -c -P 16 4 "$APK" > "$WORK/zipalign-16k.log" 2>&1
          java -Xmx4g -jar "$TOOLS/apktool.jar" d -f -o "$WORK/decoded" "$APK" > "$WORK/decode.log" 2>&1
          {
            echo "WORK=$WORK"
            echo "APK=$APK"
          } >> "$GITHUB_ENV"
      - name: Verify hashes, signature oracle, and all 23 patched methods
        run: |
          python3 .github/scripts/verify_release.py "$APK" "$WORK/decoded" "$WORK/evidence"
          cp "$WORK/signature-verify.log" "$WORK/zipalign-4.log" "$WORK/zipalign-16k.log" "$WORK/evidence/"
      - name: Publish verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest="analysis/remote/verify-rev4-${GITHUB_RUN_ID}"
          mkdir -p "$dest"
          src="${RUNNER_TEMP}/rev4-verify/evidence"
          if [ -d "$src" ]; then cp -a "$src/." "$dest/"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$dest"
          if ! git diff --cached --quiet; then
            git commit -m "Independently verify published revision 4 APK (run ${GITHUB_RUN_ID}) [skip ci]"
            git fetch origin arena/7234f8d6-apks
            git rebase FETCH_HEAD
            git push origin HEAD:arena/7234f8d6-apks
          fi
